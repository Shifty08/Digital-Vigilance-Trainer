{% extends 'trainer/base.html' %}

{% block content %}
<style>
    .mfa-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }

    .mfa-card {
        background: rgba(2, 44, 34, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        width: 100%;
        max-width: 420px;
        padding: 45px 40px;
        border-radius: 24px;
        border: 1px solid rgba(52, 211, 153, 0.3);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                    0 0 30px rgba(16, 185, 129, 0.15);
        text-align: center;
        color: white;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .mfa-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 800;
        color: #34d399;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 15px;
        background: rgba(16, 185, 129, 0.1);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .mfa-card h2 {
        margin: 0 0 12px 0;
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #ffffff;
    }

    .mfa-card p {
        color: #a7f3d0;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    .mfa-card p b {
        color: #ffffff;
    }

    .otp-input {
        width: 100%;
        padding: 18px;
        border-radius: 14px;
        border: 1.5px solid rgba(52, 211, 153, 0.3);
        background: rgba(0, 0, 0, 0.45);
        color: #34d399;
        font-size: 2rem;
        font-weight: 900;
        text-align: center;
        letter-spacing: 12px;
        outline: none;
        box-sizing: border-box;
        margin-bottom: 25px;
        transition: all 0.3s ease;
        font-family: monospace;
    }

    .otp-input:focus {
        border-color: #34d399;
        background: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.35);
    }

    .btn-verify {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        font-size: 1rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-verify:hover {
        background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(52, 211, 153, 0.4);
    }

    .btn-verify:active {
        transform: translateY(0);
    }

    .error-alert {
        background: rgba(225, 29, 72, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.4);
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 25px;
        font-size: 0.85rem;
        font-weight: 700;
        backdrop-filter: blur(5px);
    }

    .link-return {
        color: #94a3b8;
        font-size: 0.85rem;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .link-return:hover {
        color: #34d399;
    }
</style>

<div class="mfa-container">
    <div class="mfa-card">
        <div class="mfa-badge">SECURITY STEP 02 // MFA</div>
        <h2>VERIFY YOUR EMAIL</h2>
        <p>Agent <b>{{ username }}</b>, enter the 6-digit passcode sent to <b>{{ email }}</b>.</p>

        {% if error %}
            <div class="error-alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <input type="text" 
                   name="otp_code" 
                   class="otp-input" 
                   maxlength="6" 
                   placeholder="000000" 
                   required 
                   autofocus 
                   autocomplete="off">

            <button type="submit" class="btn-verify">
                Verify Passcode
            </button>
        </form>

        <div style="margin-top: 25px;">
            <a href="{% url 'login' %}" class="link-return">
                ← Cancel & Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
